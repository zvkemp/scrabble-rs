[package]
name = "scrabble"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "^1.0.145", features = ["raw_value"] }
axum = { version = "^0.8.7", features = ["ws"] }
tokio = { version = "1.48.0", features = ["full", "tracing"] }
# axum-channels = { git = "https://github.com/zvkemp/axum-channels" }
axum-channels = { git = "https://github.com/zvkemp/axum-channels", rev = "7db01c7" }
axum-macros = "0.5.0"
tower = "0.5.2"
askama = "0.14"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing = "0.1.43"
bcrypt = "0.17.1"
sqlx = { version = "*", features = [
  "migrate",
  "postgres",
  "runtime-tokio-rustls",
  "json",
] }
hmac = "*"
cookie = { version = "^0.18.1", features = ["secure"] }
reqwest = { version = "0.12.24", features = ["rustls-tls", "json", "charset", "http2"], default-features = false }
dotenv = "*"
lazy_static = "*"
console-subscriber = "*"
tower-http = { version = "0.6.7", features = ["fs"] }
tower-cookies = { version = "^0.11.0", features = ["private"] }
parking_lot = "*"
pin-project = "*"
itertools = "0.14.0"
